<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Wayframe camera">
  <defs>
    <clipPath id="body"><rect x="6" y="18" width="52" height="34" rx="10"/></clipPath>
    <radialGradient id="lens" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#5b8fe0"/><stop offset=".55" stop-color="#2f5fb3"/><stop offset="1" stop-color="#1b3b78"/>
    </radialGradient>
  </defs>
  <ellipse cx="32" cy="57" rx="22" ry="3" fill="#231f19" opacity=".14"/>
  <!-- shutter button and viewfinder -->
  <rect x="41" y="11.5" width="10" height="8" rx="3" fill="#c8372d" stroke="#231f19" stroke-width="3"/>
  <rect x="13" y="12.5" width="13" height="8" rx="3.5" fill="#f5efe3" stroke="#231f19" stroke-width="3"/>
  <!-- body -->
  <rect x="6" y="18" width="52" height="34" rx="10" fill="#fffdf8"/>
  <g clip-path="url(#body)">
    <rect x="6" y="18" width="52" height="11" fill="#c8372d"/>
    <rect x="6" y="28" width="52" height="2.5" fill="#231f19" opacity=".12"/>
  </g>
  <rect x="6" y="18" width="52" height="34" rx="10" fill="none" stroke="#231f19" stroke-width="3"/>
  <!-- flash -->
  <rect x="43" y="21.5" width="9" height="4" rx="2" fill="#ffd37a"/>
  <circle cx="14" cy="23.5" r="1.7" fill="#fffdf8"/>
  <!-- lens -->
  <circle cx="32" cy="36" r="11" fill="#231f19"/>
  <circle cx="32" cy="36" r="8" fill="url(#lens)"/>
  <circle cx="32" cy="36" r="3.4" fill="#142a57" opacity=".85"/>
  <circle cx="28.4" cy="32.4" r="2.5" fill="#fff" opacity=".95"/>
  <circle cx="35.6" cy="39.4" r="1.1" fill="#fff" opacity=".8"/>
  <!-- cheeks and smile -->
  <ellipse cx="13" cy="42" rx="3.2" ry="2.1" fill="#f4a6a0" opacity=".8"/>
  <ellipse cx="51" cy="42" rx="3.2" ry="2.1" fill="#f4a6a0" opacity=".8"/>
  <path d="M28.5 48.6q3.5 2.6 7 0" fill="none" stroke="#231f19" stroke-width="1.8" stroke-linecap="round"/>
</svg>
