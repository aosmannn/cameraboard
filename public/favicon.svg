<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Wayframe">
  <defs>
    <clipPath id="body"><rect x="4.5" y="17" width="55" height="37" rx="11"/></clipPath>
    <clipPath id="globe"><circle cx="32" cy="36" r="12.5"/></clipPath>
    <radialGradient id="sea" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#cfe6ea"/><stop offset=".55" stop-color="#8fb9c3"/><stop offset="1" stop-color="#4f7c8a"/>
    </radialGradient>
  </defs>
  <ellipse cx="32" cy="59" rx="22" ry="2.6" fill="#231f19" opacity=".14"/>
  <!-- shutter button and viewfinder bump -->
  <rect x="42" y="10.5" width="10" height="9" rx="3" fill="#b3242c" stroke="#231f19" stroke-width="3"/>
  <rect x="12" y="12" width="14" height="9" rx="3.5" fill="#f5efe3" stroke="#231f19" stroke-width="3"/>
  <!-- camera body: paper with a red top band -->
  <rect x="4.5" y="17" width="55" height="37" rx="11" fill="#fffdf8"/>
  <g clip-path="url(#body)">
    <rect x="4.5" y="17" width="55" height="11" fill="#b3242c"/>
    <rect x="4.5" y="27.5" width="55" height="2" fill="#231f19" opacity=".14"/>
  </g>
  <rect x="4.5" y="17" width="55" height="37" rx="11" fill="none" stroke="#231f19" stroke-width="3"/>
  <circle cx="13" cy="22.5" r="1.7" fill="#fffdf8"/>
  <rect x="44" y="21" width="9" height="3.6" rx="1.8" fill="#ffd37a"/>
  <!-- the lens is a globe -->
  <circle cx="32" cy="36" r="14.5" fill="#231f19"/>
  <circle cx="32" cy="36" r="12.5" fill="url(#sea)"/>
  <g clip-path="url(#globe)">
    <path d="M18 31c3-4 8-5 11-2.5 2 1.7 1 4-1.2 5.2-2.4 1.2-3 3.4-6 3.6-2 .1-3.4-2.800-3.800-6.300z" fill="#eadfc4"/>
    <path d="M35 40c3-2.500 8-2 11 .5 1.200 1 1.500 3 .5 5.500H35.500c-2-1.200-2.800-4-.5-6z" fill="#d2dab8"/>
    <path d="M36 25.500c2.500-1.500 6-1 8.500 1.200-1.500 2.200-4.500 3-7 2.200-1.500-.5-2.200-2.300-1.500-3.400z" fill="#eadfc4"/>
    <ellipse cx="32" cy="36" rx="5.200" ry="12.500" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width=".9"/>
    <path d="M19.500 36h25M21 30.500q11 3.200 22 0M21 41.500q11-3.200 22 0" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width=".9"/>
  </g>
  <!-- the way: red string across the globe, ending in a pin -->
  <path d="M20.200 42.500C24 39 27 41.500 30 37.500S35.500 32 39 28.200" fill="none" stroke="#b3242c" stroke-width="2.300" stroke-linecap="round"/>
  <circle cx="20.200" cy="42.500" r="1.900" fill="#fffdf8" stroke="#b3242c" stroke-width="1.500"/>
  <path d="M39.500 20.800c-2.800 0-4.600 2-4.600 4.400 0 3 3.100 4.800 4.600 7.500 1.500-2.700 4.600-4.500 4.600-7.500 0-2.400-1.800-4.400-4.600-4.400z" fill="#b3242c" stroke="#fffdf8" stroke-width="1.300"/>
  <circle cx="39.500" cy="25.200" r="1.700" fill="#fffdf8"/>
  <!-- glint on the glass -->
  <path d="M23.500 31.500a10 10 0 0 1 5-4.300" fill="none" stroke="#fff" stroke-width="1.800" stroke-linecap="round" opacity=".85"/>
  <!-- cheeks and smile -->
  <ellipse cx="11.500" cy="44" rx="3" ry="2" fill="#f4a6a0" opacity=".8"/>
  <ellipse cx="52.500" cy="44" rx="3" ry="2" fill="#f4a6a0" opacity=".8"/>
</svg>
