# Applies new files in supabase/migrations to the live database whenever they are pushed.
# One-time setup: add two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  from https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password for the project (Project Settings -> Database)
name: Database
on:
  push:
    branches: [main, claude/wizardly-volta-nu9jyr, adam/world-map-ui]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
concurrency: database
jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check the secrets are set
        id: sec
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Database changes were not applied automatically. Add the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets to turn this on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.sec.outputs.ready == 'true'
        run: supabase link --project-ref psuykzkrakkdqhulrqig
      - if: steps.sec.outputs.ready == 'true'
        run: supabase db push
