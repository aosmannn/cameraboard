<!-- Paste into BOTH Authentication > Email Templates > "Confirm signup" and "Magic Link".
     Subject: Your Wayframe code
     It shows the 6-digit code and no link, so people never see a Supabase page. -->
<div style="font-family:system-ui,sans-serif;max-width:420px;margin:0 auto;padding:24px">
  <h2 style="font-family:Georgia,serif;font-weight:400;font-size:28px;margin:0 0 8px">Your Wayframe code</h2>
  <p style="color:#555;margin:0 0 20px">Type this code into Wayframe to sign in:</p>
  <p style="font-size:36px;letter-spacing:8px;font-weight:700;margin:0 0 20px">{{ .Token }}</p>
  <p style="color:#777;font-size:13px">It works for one hour. If you didn&rsquo;t ask for it, you can ignore this email.</p>
</div>
